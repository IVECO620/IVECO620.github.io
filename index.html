<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMSI repainty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        /* Horní lišta */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 20px;
            color: #222;
        }

        .logo-icon {
            background-color: #ff8c00;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 18px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        nav a.active {
            color: #d9534f;
        }

        .btn-support {
            background-color: #ff8c00;
            color: white !important;
            padding: 8px 16px;
            border-radius: 5px;
        }

        /* Hlavní obsah */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #111;
        }

        /* Mřížka pro autobusy */
        .grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: calc(33.333% - 20px);
            text-decoration: none;
            color: inherit;
        }

        .card-img-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: #444;
            line-height: 1.4;
        }

        /* Reakce na menší obrazovky */
        @media (max-width: 900px) {
            .card {
                width: calc(50% - 15px);
            }
        }
        @media (max-width: 600px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- NAVIGAČNÍ LIŠTA -->
    <header>
        <div class="logo">
            <span class="logo-icon">🚌</span>
            <span>OMSI repainty</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">VŠECHNY</a></li>
                <li><a href="#">REPAINTY</a></li>
                <li><a href="#">VOZIDLA</a></li>
                <li><a href="#">NAHRÁT</a></li>
                <li><a href="#">PRAVIDLA</a></li>
                <li><a href="#">KONTAKT</a></li>
                <li><a href="#" class="btn-support">Chci podpořit!</a></li>
            </ul>
        </nav>
    </header>

    <!-- HLAVNÍ STRÁNKA -->
    <div class="container">
        <h1>Všechny repainty</h1>

        <div class="grid">

            <!-- PRVNÍ AUTOBUS -->
            <a href="#" class="card">
                <div class="card-img-container">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg/800px-Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg" alt="IVECO Crossway">
                </div>
                <h3>IVECO Crossway LE line 12m – GW BUS</h3>
            </a>

            <!-- DRUHÝ AUTOBUS -->
            <a href="#" class="card">
                <div class="card-img-container">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg/800px-Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg" alt="Iveco Crossway PACK">
                </div>
                <h3>Iveco Crossway LE 14.5M – (PACK)</h3>
            </a>

            <!-- TŘETÍ AUTOBUS -->
            <a href="#" class="card">
                <div class="card-img-container">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg/800px-Havi%C5%99ov%2C_Autobus_Karosa_B951.jpg" alt="Iveco Urbanway">
                </div>
                <h3>Iveco Urbanway 12M CNG – DPKV 434, CVR Globus</h3>
            </a>

        </div>
    </div>

</body>
</html>
