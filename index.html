<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMSI 2 Repainty - IVECO620</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            background-color: #242424;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 4px solid #ff9800;
        }
        h1 {
            color: #ff9800;
            margin: 0 0 10px 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background-color: #242424;
            border-radius: 8px;
            padding: 15px;
            width: calc(50% - 10px);
            box-sizing: border-box;
            border: 1px solid #333;
        }
        .card h3 {
            color: #ff9800;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #ff9800;
            color: #000;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>OMSI 2 Repainty</h1>
            <p>Vítám vás na mém webu s nátěry pro autobusy do OMSI 2!</p>
        </header>

        <h2>Moje repainty ke stažení</h2>

        <div class="grid">
            
            <!-- PRVNÍ REPAINT -->
            <div class="card">
                <h3>Karosa B951E - DPP Praha</h3>
                <p><strong>Model:</strong> Karosa B951E</p>
                <p>Nátěr Dopravního podniku hl. m. Prahy.</p>
                <a href="#" class="btn">Stáhnout repaint</a>
            </div>

            <!-- DRUHÝ REPAINT -->
            <div class="card">
                <h3>Iveco Urbanway 12M</h3>
                <p><strong>Model:</strong> Iveco Urbanway</p>
                <p>Městský nátěr pro autobusy Iveco.</p>
                <a href="#" class="btn">Stáhnout repaint</a>
            </div>

        </div>
    </div>

</body>
</html>
